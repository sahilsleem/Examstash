      <rect x="3" y="7" width="30" height="40" rx="4" fill="#ffffff" />
      <rect x="7" y="14" width="14" height="3" rx="1.5" fill="#0d9488" />
      <rect x="7" y="20" width="22" height="2" rx="1" fill="#cbd5e1" />
      <rect x="7" y="24" width="18" height="2" rx="1" fill="#cbd5e1" />
      <rect x="7" y="28" width="22" height="2" rx="1" fill="#cbd5e1" />
      <circle cx="26" cy="38" r="5" fill="#0d9488" />
